name: Simulation Sanity Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  EOSIM_VERSION: "3.0.2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulate:
    name: EoSim ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - arm64-linux
          - riscv64-linux
          - stm32f4
          - raspi4
          - vexpress-a9
          - sifive_u
          - esp32
          - nrf52
          - imx8m
          - jetson-nano
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # EoSim v3.0.2 is a real tag. No release ships a wheel, so install from
      # a git checkout; platforms ship in-package since v3.0.2 (no copy needed).
      - name: Install EoSim from source
        run: |
          git clone --depth 1 --branch v${{ env.EOSIM_VERSION }} https://github.com/embeddedos-org/EoSim.git /tmp/EoSim
          pip install -e /tmp/EoSim
      - name: Validate platform
        run: eosim info ${{ matrix.platform }}
      - name: Simulate ${{ matrix.platform }}
        run: |
          echo "=== EoSim: ${{ matrix.platform }} ==="
          eosim run ${{ matrix.platform }} --headless --timeout 15
      - name: Run platform tests
        run: eosim test ${{ matrix.platform }}
      - name: Collect artifacts
        run: eosim artifact ${{ matrix.platform }}

  cross-platform:
    name: Cross-Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install EoSim from source
        run: |
          git clone --depth 1 --branch v${{ env.EOSIM_VERSION }} https://github.com/embeddedos-org/EoSim.git /tmp/EoSim
          pip install -e /tmp/EoSim
      - name: Validate all platforms
        run: eosim list && eosim doctor
      - name: List platforms
        run: eosim list

  sanity-gate:
    name: Simulation Gate
    if: always()
    needs: [simulate, cross-platform]
    runs-on: ubuntu-latest
    steps:
      # Iterates toJSON(needs) rather than naming each dependency. The
      # previous body printed both results and branched on `simulate` alone,
      # so a red or skipped `cross-platform` -- three OS legs -- passed the
      # gate and it still printed "All simulation checks passed". That is the
      # fail-open shape ci.yml's gate was written to remove, in a job whose
      # name a maintainer would plausibly require. This form cannot fall out
      # of step with `needs:`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every job in this workflow must have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: printf '%s' "$RESULTS" | .github/scripts/ci-gate-check.sh
